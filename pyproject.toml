[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rev-decision-model"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.6",
  "transformers==5.19.0",
  "peft==0.21.2",
  "tokenizers==0.23.2",
  "safetensors==0.8.0",
  "huggingface-hub==1.33.0",
  "accelerate==1.15.0",
  "pyarrow>=15",
]

[tool.setuptools]
py-modules = ["model", "data", "train", "evaluate", "demo"]
